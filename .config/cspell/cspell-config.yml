# Configuration file for CSpell
# CSpell checks this config file too
# so we may need to use CSpell's ignore functionality in some cases,
# e.g. before the ignoreRegExpList below.
---
# ---------------------------------------------------------------------------
# 1. Core settings
# ---------------------------------------------------------------------------
# Version of setting file. Always 0.2
version: "0.2"

# Use British English and Swedish
# Note: The British English dictionary includes some US spellings 
language: en-gb,sv

# Treat differently capitalised words as distinct.
caseSensitive: true

# Exclude files and directories matched by .gitignore.
useGitignore: true

# ---------------------------------------------------------------------------
# 2. Installed dictionary packages
# ---------------------------------------------------------------------------

# Load dictionary extensions installed through .config/cspell/package.json.
# The GitHub Actions workflow installs them before running CSpell.
# For local installation instructions, see .config/cspell/README.md.
import:
  - "@cspell/dict-en-gb/cspell-ext.json"
  - "@cspell/dict-medicalterms/cspell-ext.json"
  - "@cspell/dict-people-names/cspell-ext.json"
  - "@cspell/dict-scientific-terms-gb/cspell-ext.json"
  - "@cspell/dict-software-terms/cspell-ext.json"
  - "@cspell/dict-sv/cspell-ext.json"

# ---------------------------------------------------------------------------
# 3. Enabled dictionaries
# ---------------------------------------------------------------------------

# Dictionaries enabled globally for all checked files.
# Directory-specific dictionaries are enabled later under overrides.
# The dictionary extensions imported in section 2 are enabled automatically.
dictionaries:
  # Custom dictionaries defined below
  - approved-acronyms
  - approved-names
  - forbidden-words
  - project-specific-words

  # Dictionaries bundled with CSpell
  - cpp-compound-words
  - python
  - python-common

# ---------------------------------------------------------------------------
# 4. Custom dictionary definitions
# ---------------------------------------------------------------------------

# Register custom dictionary files.
# Dictionaries are enabled globally in section 3 or selectively under overrides.
dictionaryDefinitions:
  # Globally enabled dictionaries.
  - name: approved-acronyms
    path: ./custom-dicts/approved-acronyms.txt
    addWords: true

  - name: approved-names
    path: ./custom-dicts/approved-names.txt
    addWords: true

  - name: forbidden-words
    path: ./custom-dicts/forbidden-words.txt

  - name: project-specific-words
    path: ./custom-dicts/project-specific-words.txt
    addWords: true

  # Directory-specific dictionaries enabled under overrides.
  - name: data-words
    path: ./custom-dicts/data-words.txt
    addWords: true
  
  - name: guidance-words
    path: ./custom-dicts/guidance-words.txt
    addWords: true

  - name: highlight-words
    path: ./custom-dicts/highlight-words.txt
    addWords: true

  - name: news-words
    path: ./custom-dicts/news-words.txt
    addWords: true
  
  - name: open-science-words
    path: ./custom-dicts/open-science-words.txt
    addWords: true

# ---------------------------------------------------------------------------
# 5. Ignored files
# ---------------------------------------------------------------------------

# Paths to ignore during spell checking
ignorePaths:
  # Package manifests and generated lockfiles.
  - "**/package.json"
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"

  # Custom dictionary sources are maintained separately.
  - "**/custom-dicts/*.txt"

  # Repository path and ownership rules.
  - "**/.gitignore"
  - "**/CODEOWNERS"

  # Tool configuration containing only selectors, identifiers and metadata.
  - "**/pa11y.config"
  - "**/static/browserconfig.xml"

# ---------------------------------------------------------------------------
# 6. Language-specific settings
# ---------------------------------------------------------------------------

# Language settings for specific file types.
languageSettings:
  # Enable HTML terminology for HTML and XML files.
  - languageId: html,xml
    dictionaries:
      - html

  # Enable CSS terminology and allow valid CSS spelling.
  - languageId: css,scss
    dictionaries:
      - css
    ignoreWords:
      - gray # cspell:disable-line

  # Enable programming terminology for JavaScript files.
  - languageId: javascript,javascriptreact
    dictionaries:
      - typescript

  # Enable Docker terminology and accept differently cased identifiers.
  - languageId: dockerfile
    caseSensitive: false
    dictionaries:
      - docker

# ---------------------------------------------------------------------------
# 7. Global ignore patterns
# ---------------------------------------------------------------------------

# Patterns that may appear across multiple file types.
ignoreRegExpList:
  # Links and addresses
  - MarkdownLink # Link targets but check link text
  - Url # Complete URLs, such as https://www.example.com
  - '/\b[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z]{2,}\b/gi' # Bare domain names. cspell:disable-line
  - '/scilifelab\.[a-z0-9.-]+/gi' # SciLifeLab domain names. cspell:disable-line
  - '/@scilifelab\./gi' # SciLifeLab email domains. cspell:disable-line

  # DOI identifiers
  - '/\d+\/scilifelab\./gi' # SciLifeLab DOI prefixes. cspell:disable-line
  - '/\d+\/pnas\./gi' # PNAS DOI prefixes. cspell:disable-line
  - '/DOI:.*/g' # Text containing a labelled DOI reference. cspell:disable-line

  # Domain patterns
  - '/(?<=\/img\/logos\/)scilifelab(?=\\?_thumbnail\.[a-z0-9]+\b)/gi' # cspell:disable-line
  - '/ddls[a-zA-Z0-9._-]*/g'

  # Field patterns in JSON / YAML
  - '/"url"\s*:\s*"[^"]*"/g'
  - '/images: \[.*\]/g'
  - '/banner(?:_large)?:\s*[a-zA-Z0-9./_-]+/g'
  - '/thumbnail: \".*\"/g'
  - '/\bsrc\s*=\s*"[^"]*"/g'
  - '/"ddls"\s*:/g' # cspell:disable-line

  # Other
  - '/#datacentre_[a-z0-9_-]+/g' # cspell:disable-line
  - '/decodeURIComponent\([^)]*\)/g'
  - '/\/subcellbarcode\//gi'  # cspell:disable-line
  - 'de novo'
  - >-
    /(?<=<div\b[^>]*?\bclass\s*=\s*["'][^"']*)\bgray\b(?=[^"']*["'][^>]*>)/




 
overrides:
  - filename: "**/CITATION.cff"
    words: 
      - orcid # cspell:disable-line
  
  - filename: "**/config.yaml"
    words:
      - goldmark # cspell:disable-line

  - filename: "**/layouts/jobs/list.html"
    words:
      - univ # cspell:disable-line
  
  - filename: "**/layouts/events/list.html"
    ignoreRegExpList:
      # Allow the external API property name.
      - '/(?<=\?\.)organizer\b/g' # cspell:disable-line

  - filename: "**/layouts/contact/list.html"
    ignoreRegExpList:
      # Allow the JavaScript scrolling option.
      - '/\bbehavior(?=\s*:)/g' # cspell:disable-line

  - filename: "**/data/**/*.json"
    ignoreRegExpList:
      # 'Ignore' these fields completely.
      - '/"(?:maintained_by_url|support_email|thumbnail)"\s*:\s*"[^"]*"/g'

      # Allow these words only inside search_tags.
      - '/(?<="search_tags"\s*:\s*\[[^\]]*)\b(?:Catalog|catalog|embl|localization|tumor|visualization|visualize|Altmetrics|metatlas|rnafusion|raredisease|cutadapt|SBDI|gbif|GBIF|snakemake|fastq|FASTQ|coidb|sweden|clinvar|ClinVar|ensembl|Ensembl|chanjo2|sarek|multiqc|bioconda|metaanalysis|Olink|OMIM|pathwax|funcoup|BinoX|plumx|impactstory|adiposetissue|metagenomes|TCGA|TCIA)\b/g' # cspell:disable-line

      # Allow complete nf-core identifiers in names and descriptions.
      - '/\bnf-core\/[A-Za-z0-9][A-Za-z0-9._-]*/g'
      
  - filename: "**/data/**"
    dictionaries:
      - data-words

  - filename: "**/content/open_science/**"
    dictionaries:
      - open-science-words

  - filename: "**/content/news/**"
    dictionaries:
      - news-words
  
  - filename: "**/content/highlights/**"
    dictionaries:
      - highlight-words

  - filename: "**/content/guidance/**"
    dictionaries:
      - guidance-words

  - filename: "**/assets/**"
    ignoreRegExpList:
      # Allow the CSS property spelling when immediately followed by a colon.
      - '/\bcolor(?=:)/g' # cspell:disable-line
    
      # Allow the first manifest dictionary key.
      - '/"background_color"\s*:/g' # cspell:disable-line

      # Allow the second manifest dictionary key.
      - '/"theme_color"\s*:/g' # cspell:disable-line


  - filename: "**/*.html"
    ignoreRegExpList:
      # Allow the CSS property spelling inside double-quoted inline styles.
      - '/(?<=\bstyle\s*=\s*"[^"]*)\bcolor(?=:)/g' # cspell:disable-line

  - filename: "**/.github/**/*.{yml,yaml}"
    words:
      - ScilifelabDataCentre # cspell:disable-line
      - sarif # cspell:disable-line
    ignoreRegExpList:
      # Ignore GitHub Action identifiers.
      - '/^\s*uses:\s*\S+/gm'

      # Ignore container image values.
      - '/^\s*images:\s*.*$/gm'

      # Ignore image reference values.
      - '/^\s*image-ref:\s*.*$/gm'

  - filename: "**/layouts/partials/schema.html"
    ignoreWords: # ignoreWords to override forbidden-words
      - Catalog # cspell:disable-line
    ignoreRegExpList:
      # Preserve the official Schema.org type identifier.
      - '/"@type"\s*:\s*"Organization"/g' # cspell:disable-line


  - filename: "**/data/data_sources.json"
    ignoreWords: # ignoreWords to override forbidden-words
      - Catalog # cspell:disable-line
