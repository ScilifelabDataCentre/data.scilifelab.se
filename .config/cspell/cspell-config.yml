# Configuration file for CSpell
# CSpell checks this config file too
# so we may need to use CSpell's ignore functionality in some cases,
# e.g. before the ignoreRegExpList below.
---
# Version of setting file. Always 0.2
version: "0.2"

# Languages used for spell checking
# en-gb is British English; sv is Swedish
# Note: British English may allow some US spellings
language: en-gb,sv

# Extra dictionaries that are enabled when imported
# Note: These dictionaries must be installed before import
# (see .github/workflows/cspell.yml)
import:
  - "@cspell/dict-sv/cspell-ext.json"
  - "@cspell/dict-people-names/cspell-ext.json"
  - "@cspell/dict-medicalterms/cspell-ext.json"

# Spell checking is case-sensitive
caseSensitive: true

# Additional dictionaries to use during spell checking
# These do not require installation or import
# See https://github.com/streetsidesoftware/cspell-dicts#cspell-dicts
dictionaries:
  - approved-names
  # - companies
  - cpp-compound-words
  # - fonts
  # - css
  # - docker
  - forbidden-words
  # - fullstack
  # - html
  # - k8s
  # - latex
  - project-specific-words
  - python
  - python-common
  # - ruby
  # - sql
  # - software-tools
  # - typescript

# Import project-specific words as a custom dictionary
dictionaryDefinitions:
  - name: project-specific-words
    path: ./project-specific-words.txt
    addWords: true
  - name: approved-names
    path: ./approved-names.txt
    addWords: true
  - name: forbidden-words
    path: ./forbidden-words.txt

# Language settings for specific file types
languageSettings:
  - languageId: html,xml
    dictionaries:
      - html

  - languageId: css,scss
    dictionaries:
      - css

  - languageId: javascript,javascriptreact
    dictionaries:
      - typescript

  - languageId: dockerfile
    caseSensitive: false
    dictionaries:
      - docker

# Patterns to ignore during spell checking
# cSpell:ignore datacentre
ignoreRegExpList:
  - MarkdownLink # Ignore link target, but still check link text
  - Url # Ignore full URLs, such as https://www.example.com
  - '/\b[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z]{2,}\b/gi' # Ignore domain names without a protocol
  - '/#datacentre_[a-z0-9_-]+/g' # Ignore Slack channel names starting with #datacentre_
  - '/(?<=\/img\/logos\/)scilifelab(?=\\?_thumbnail\.[a-z0-9]+\b)/gi' # Ignore scilifelab in image file names
  - '/decodeURIComponent\([^)]*\)/g' # Ignore decodeURIComponent() calls
  # - '/(?<=\/)arnold(?=\/)/gi'
  # - '/https?%3A(?:%2F){2}[A-Za-z0-9%._~-]+/gi'
  # - '/\bscilifelab(?=[\\\w.-]*\.[a-z0-9]+\b)/gi'
  # - '/\b(?:[a-z0-9-]+\.)*scilifelab\.se\b/gi'
  # - '/\$[A-Za-z_][A-Za-z0-9_]*/g' # Hugo template variables
  # - '/{{[\s\S]*?}}/g'  # Hugo template actions
  # - '/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi' # Entire script elements
  # - '/"(?:thumbnail|url)"\s*:\s*"[^"]*"/g'
  # - '/^\s*"metatlas",?\s*$/gm'
  # - '/"(?:thumbnail|url|maintained_by_url|support_github|support_website)"\s*:\s*"[^"]*"/g'
  # - '/\bnf-core\/[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?/g'
  # - '/"search_tags"\s*:\s*\[[\s\S]*?\]/g'

# Skip files that match the globs in the .gitignore file
useGitignore: true

# Paths to ignore during spell checking
ignorePaths:
  - "**/package.json"
  - "**/package-lock.json"
  - "**/static/browserconfig.xml"
  - "**/pnpm-lock.yaml"
  - "**/layouts/guidance/data_source.html"
 
overrides:
  - filename: "**/CITATION.cff"
    words: 
      - orcid
  
  - filename: "**/config.yaml"
    words:
      - goldmark

  - filename: "**/layouts/jobs/list.html"
    words:
      - univ
  
  - filename: "**/data/services.json"
    ignoreRegExpList:
      # 'Ignore' these fields completely.
      - '/"(?:url|maintained_by_url|support_email|thumbnail)"\s*:\s*"[^"]*"/g'

      # Allow these words only inside search_tags.
      - '/(?<="search_tags"\s*:\s*\[[^\]]*)\b(?:metatlas|rnafusion|raredisease|cutadapt|SBDI|gbif|GBIF|snakemake|fastq|FASTQ|coidb|sweden|clinvar|ClinVar|ensembl|Ensembl|chanjo2|sarek|multiqc|bioconda|metaanalysis|Olink|OMIM|pathwax|funcoup|BinoX)\b/g'

      # Allow complete nf-core identifiers in names and descriptions.
      - '/\bnf-core\/[A-Za-z0-9][A-Za-z0-9._-]*/g'
      
  - filename: "**/data/open_science/initiatives.json"
    ignoreRegExpList:
      - '/"url"\s*:\s*"[^"]*"/g'
      