# Configuration file for CSpell
# CSpell checks this config file too
# so we may need to use CSpell's ignore functionality in some cases,
# e.g. before the ignoreRegExpList below.
---
# Version of setting file. Always 0.2
version: "0.2"

# Languages used for spell checking
# en-gb is British English; sv is Swedish
# Note: British English may allow some US spellings
language: en-gb,sv

# Extra dictionaries that are enabled when imported
# Note: These dictionaries must be installed before import
# (see .github/workflows/cspell.yml)
import:
  - "@cspell/dict-en-gb/cspell-ext.json"
  - "@cspell/dict-sv/cspell-ext.json"
  - "@cspell/dict-people-names/cspell-ext.json"
  - "@cspell/dict-medicalterms/cspell-ext.json"
  - "@cspell/dict-software-terms/cspell-ext.json"
  - "@cspell/dict-scientific-terms-gb/cspell-ext.json"

# Spell checking is case-sensitive
caseSensitive: true

# Additional dictionaries to use during spell checking
# These do not require installation or import
# See https://github.com/streetsidesoftware/cspell-dicts#cspell-dicts
dictionaries:
  - approved-acronyms
  - approved-names
  - cpp-compound-words
  - forbidden-words
  - project-specific-words
  - python
  - python-common
  - software-terms
  - software-tools
  - scientific-terms-gb

# Import project-specific words as a custom dictionary
dictionaryDefinitions:
  - name: project-specific-words
    path: ./custom-dicts/project-specific-words.txt
    addWords: true

  - name: approved-names
    path: ./custom-dicts/approved-names.txt
    addWords: true
  
  - name: approved-acronyms
    path: ./custom-dicts/approved-acronyms.txt
    addWords: true

  - name: highlight-words
    path: ./custom-dicts/highlight-words.txt
    addWords: true

  - name: news-words
    path: ./custom-dicts/news-words.txt
    addWords: true
  
  - name: data-words
    path: ./custom-dicts/data-words.txt
    addWords: true
  
  - name: guidance-words
    path: ./custom-dicts/guidance-words.txt
    addWords: true
  
  - name: open-science-words
    path: ./custom-dicts/open-science-words.txt
    addWords: true

  - name: forbidden-words
    path: ./custom-dicts/forbidden-words.txt

# Language settings for specific file types
# cspell:ignore center gray
languageSettings:
  - languageId: html,xml
    dictionaries:
      - html

  - languageId: css,scss
    dictionaries:
      - css
    ignoreWords:
      - center
      - gray

  - languageId: javascript,javascriptreact
    dictionaries:
      - typescript
    ignoreWords:
      - center

  - languageId: dockerfile
    caseSensitive: false
    dictionaries:
      - docker
  


# Patterns to ignore during spell checking
ignoreRegExpList:
  # Built-in patterns
  - MarkdownLink # Ignore link target, but still check link text
  - Url # Ignore full URLs, such as https://www.example.com

  # Domain patterns
  - '/\b[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z]{2,}\b/gi' # cspell:disable-line
  - '/scilifelab\.[a-z0-9.-]+/gi'  # cspell:disable-line
  - '/(?<=\/img\/logos\/)scilifelab(?=\\?_thumbnail\.[a-z0-9]+\b)/gi' # cspell:disable-line
  - '/ddls[a-zA-Z0-9._-]*/g'

  # DOI patterns
  - '/\d+\/scilifelab\./gi' # cspell:disable-line
  - '/\d+\/pnas\./gi'  # cspell:disable-line
  - '/DOI:.*/g'

  # Email patterns
  - '/@scilifelab\./gi' # cspell:disable-line

  # Field patterns in JSON / YAML
  - '/"url"\s*:\s*"[^"]*"/g'
  - '/images: \[.*\]/g'
  - '/banner(?:_large)?:\s*[a-zA-Z0-9./_-]+/g'
  - '/thumbnail: \".*\"/g'
  - '/src\=\".*\"/g'
  - '/"ddls"\s*:/g' # cspell:disable-line

  # Other
  - '/#datacentre_[a-z0-9_-]+/g' # cspell:disable-line
  - '/decodeURIComponent\([^)]*\)/g'
  - '/\/subcellbarcode\//gi'  # cspell:disable-line
  - 'de novo'
  - >-
    /(?<=<div\b[^>]*?\bclass\s*=\s*["'][^"']*)\bgray\b(?=[^"']*["'][^>]*>)/

# Skip files that match the globs in the .gitignore file
useGitignore: true

# Paths to ignore during spell checking
ignorePaths:
  - "**/package.json"
  - "**/package-lock.json"
  - "**/custom-dicts/*.txt"
  - "**/static/browserconfig.xml"
  - "**/pnpm-lock.yaml"
  - "**/CODEOWNERS"
  - "**/pa11y.config"
  - "**/.gitignore"
 
overrides:
  - filename: "**/CITATION.cff"
    words: 
      - orcid # cspell:disable-line
  
  - filename: "**/config.yaml"
    words:
      - goldmark # cspell:disable-line

  - filename: "**/layouts/jobs/list.html"
    words:
      - univ # cspell:disable-line
  
  - filename: "**/layouts/**/list.html"
    ignoreRegExpList:
      # Allow the external API property name.
      - '/(?<=\?\.)organizer\b/g' # cspell:disable-line
  
      # Allow the JavaScript scrolling option.
      - '/\bbehavior(?=\s*:)/g' # cspell:disable-line

  - filename: "**/data/**/*.json"
    ignoreRegExpList:
      # 'Ignore' these fields completely.
      - '/"(?:maintained_by_url|support_email|thumbnail)"\s*:\s*"[^"]*"/g'

      # Allow these words only inside search_tags.
      - '/(?<="search_tags"\s*:\s*\[[^\]]*)\b(?:Catalog|catalog|embl|localization|tumor|visualization|visualize|Altmetrics|metatlas|rnafusion|raredisease|cutadapt|SBDI|gbif|GBIF|snakemake|fastq|FASTQ|coidb|sweden|clinvar|ClinVar|ensembl|Ensembl|chanjo2|sarek|multiqc|bioconda|metaanalysis|Olink|OMIM|pathwax|funcoup|BinoX|plumx|impactstory|adiposetissue|metagenomes|TCGA|TCIA)\b/g' # cspell:disable-line

      # Allow complete nf-core identifiers in names and descriptions.
      - '/\bnf-core\/[A-Za-z0-9][A-Za-z0-9._-]*/g'
      
  - filename: "**/data/**"
    dictionaries:
      - data-words

  - filename: "**/content/open_science/**"
    dictionaries:
      - open-science-words

  - filename: "**/content/news/**"
    dictionaries:
      - news-words
  
  - filename: "**/content/highlights/**"
    dictionaries:
      - highlight-words

  - filename: "**/content/guidance/**"
    dictionaries:
      - guidance-words

  - filename: "**/assets/**"
    ignoreRegExpList:
      # Allow the CSS property spelling when immediately followed by a colon.
      - '/\bcolor(?=:)/g' # cspell:disable-line
    
      # Allow the first manifest dictionary key.
      - '/"background_color"\s*:/g' # cspell:disable-line

      # Allow the second manifest dictionary key.
      - '/"theme_color"\s*:/g' # cspell:disable-line


  - filename: "**/*.html"
    ignoreRegExpList:
      # Allow the CSS property spelling inside double-quoted inline styles.
      - '/(?<=\bstyle\s*=\s*"[^"]*)\bcolor(?=:)/g' # cspell:disable-line

  - filename: "**/.github/**/*.{yml,yaml}"
    words:
      - ScilifelabDataCentre # cspell:disable-line
      - sarif # cspell:disable-line
    ignoreRegExpList:
      # Ignore GitHub Action identifiers.
      - '/^\s*uses:\s*\S+/gm'

      # Ignore container image values.
      - '/^\s*images:\s*.*$/gm'

      # Ignore image reference values.
      - '/^\s*image-ref:\s*.*$/gm'

  - filename: "**/layouts/partials/schema.html"
    words: 
      - Catalog
