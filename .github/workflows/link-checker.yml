# Run htmltest to check for broken external links
# Scheduled for every first wednesday of the month

name: Check broken links (htmltest)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 1-7 * 3'

jobs:
  htmltest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Use the same Hugo version as the Dockerfile so the checked site matches the deployed one
      - name: Get Hugo version from Dockerfile
        id: hugo
        run: echo "version=$(grep -oP 'ARG HUGO_VERSION="\K[^"]+' Dockerfiles/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          
      - name: Run Hugo
        run: hugo -d dist
      
      - name: Test HTML
        continue-on-error: true
        uses: wjdp/htmltest-action@master
        with:
          path: dist
          config: .github/htmltest-config.yml
      
      - name: Archive htmltest results
        uses: actions/upload-artifact@v7
        with:
          name: htmltest-report
          path: tmp/.htmltest/htmltest.log
          retention-days: 7
