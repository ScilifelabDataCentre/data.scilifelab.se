{{ define "main" }}

<section>
  <div>
    {{ .Content }}</div>
</section>

<section id="jobs-section">
  <!-- Loading indicator -->
  <div id="jobs-loading" class="text-center py-5">
    <div class="spinner-border text-aqua" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading jobs...</span>
    </div>
    <p class="mt-3 text-muted">Loading available positions...</p>
  </div>
  
  <!-- The jobs content will be filled by JS function below -->
</section>

<script>
  // Functions need to be run when the DOM is ready
  document.addEventListener("DOMContentLoaded", async () => {
    
    // Constants
    const JOBS_API_URL = 'https://www.scilifelab.se/wp-json/wp/v2/career?categories=980&orderby=archive_date&per_page=50';
    
    // Helper functions for job data transformation
    function extractJobUrl(job) {
      try {
        return job.acf?.read_more_external_link?.url || job.link;
      } catch {
        return job.link;
      }
    }
    
    function extractEmployer(job) {
      let employer = 'SciLifeLab';
      try {
        const universityList = job.acf?.university_lists;
        if (Array.isArray(universityList) && universityList.length > 0) {
          const universities = universityList
            .filter(univ => univ && univ.university && univ.university.title)
            .map(univ => univ.university.title.trim());
          if (universities.length > 0) {
            employer = universities.join(', ');
          }
        }
      } catch (err) {
        console.warn('Error extracting employer from job:', err);
      }
      return employer;
    }
    
    // Takes a URL and returns the data fetched
    async function getDataFromUrl(url) {
      try {
        // Fetch jobs directly from SciLifeLab WordPress API
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const apiData = await response.json();
        
        // Process and transform the API response
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const filteredJobs = apiData.filter(job => {
          // Filter jobs that are not past today
          const archiveDate = new Date(job.archive_date);
          archiveDate.setHours(0, 0, 0, 0);
          return archiveDate >= today;
        });

        // Transform jobs to our format
        const transformedJobs = filteredJobs.map(job => ({
          title: job.title?.rendered || 'No title available',
          app_deadline: job.archive_date,
          job_url: extractJobUrl(job),
          employer: extractEmployer(job)
        }));

        return transformedJobs;
      } catch (error) {
        console.error('Error fetching jobs:', error);
        return []; // Return empty array if API fails
      }
    };
    
    async function addJobs(dataArray) {
      var jobsList = [], employer = new Set();
      
      // Filter and collect data in a single pass
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dataArray.forEach((job) => {
        if (new Date(job.app_deadline) >= today){
          jobsList.push(job);
          employer.add(job.employer);
        }
      });
      
      // Sort the arrays
      jobsList.sort((a,b) => (a.app_deadline > b.app_deadline) ? 1 : (a.app_deadline < b.app_deadline) ? -1 : 0);
      const sortedEmployer = Array.from(employer).sort();
      
      // If no jobs to show, display appropriate message
      if (jobsList.length === 0) {
        var jobsHTML = `<div class="alert alert-secondary mt-4">
                          We are currently unaware of any upcoming job opportunities at the SciLifeLab Data Centre. 
                          All positions shown here are specifically from the Data Centre team.
                        </div>`
      } else {
        var jobsHTML = `<div class="row mt-3 mb-5">
                          <div class="col-lg-2 pe-lg-0" id="job-filters">
                            <div class="accordion bg-light" id="filterAccordion" style="position: sticky; top: 15px;">
                              <div class="accordion-item">
                                <h2 class="accordion-header" id="headingFilters">
                                  <button class="accordion-button collapsed d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFilters" aria-expanded="false" aria-controls="collapseFilters">
                                    Filters
                                  </button>
                                  <div class="filter-heading d-none d-lg-block mb-lg-0">
                                    <h5>Filters</h5>
                                  </div>
                                </h2>
                                <div id="collapseFilters" class="accordion-collapse collapse d-lg-block" aria-labelledby="headingFilters">
                                  <div class="accordion-body">
                                    <div class="accordion" id="innerAccordion">
                                      <div class="accordion-item">
                                        <h2 class="accordion-header" id="headingEmployer">
                                          <button class="accordion-button collapsed custom-padding" type="button" data-bs-toggle="collapse" data-bs-target="#collapseEmployer" aria-expanded="true" aria-controls="collapseEmployer">
                                            Employer
                                          </button>
                                        </h2>
                                        <div id="collapseEmployer" class="accordion-collapse collapse show" aria-labelledby="headingEmployer">
                                          <div class="accordion-body">`;
        sortedEmployer.forEach((em) => {
          jobsHTML += `<div class="form-check">   
                        <input class="form-check-input" type="checkbox" id="${em}" name="employer" value="${em.replaceAll(" ", "-").toLowerCase()}">
                        <label class="form-check-label" for="${em}">${em}</label>
                      </div>`;
        });
        jobsHTML += `          </div>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="col-lg mt-2 mt-lg-0">
                            <div class="row g-2" id="jobs-container">`;
        jobsList.forEach((job) => {
          var this_employer = job.employer.replaceAll(" ", "-").toLowerCase();
          var job_date = new Date(job.app_deadline);
          jobsHTML += `<div class="col-md-6 col-lg-4 job" data-employer="${this_employer}">
                        <div class="card-box">
                          <div class="d-flex justify-content-between">
                            <div>`;
          jobsHTML += `<h5><a href="${job.job_url}" target="_blank">${job.title}</a></h5>
                       </div>
                       <div>
                         <div class="px-2 m-2 d-flex flex-column rounded event-date">
                           <div class="px-2 fs-3 mx-auto">${job_date.getDate()}</div>
                           <div class="pb-1 px-2 mx-auto">${job_date.toLocaleString('default', {'month': 'long'})}</div>
                         </div>
                       </div>
                      </div>
                      <div class="row">
                        <div class="col">
                          <b>Employer:</b> ${job.employer}
                        </div>
                      </div>
                      <div class="row mt-3">
                        <div class="col">
                          <a href="${job.job_url}" target="_blank" class="btn btn-details btn-sm">
                            <i class="bi bi-globe"></i> See Details
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>`;
        }); // For each job iteration ends here
        jobsHTML += `<div id="no-filtered-jobs" style="display:none;">
                      <p class="text-center">No jobs found for selected criteria.</p>
                    </div>
                    </div>
                  </div>
                </div>`;
      };
      
      var jobsSection = document.getElementById('jobs-section');
      jobsSection.innerHTML = jobsHTML;
      
      // Hide loading indicator
      const loadingElement = document.getElementById('jobs-loading');
      if (loadingElement) {
        loadingElement.style.display = 'none';
      }
    };
    
    function enableFiltering (){
      // Enable filtering of jobs based on selected criteria
      $('div#job-filters input:checkbox').on('change', function(){
      
        // Collect and create a list with selected values
        var employer = $('input:checkbox[name="employer"]:checked').map(function () {return this.value}).get();
    
        // Cache DOM elements for better performance
        var $jobsContainer = $('div#jobs-container');
        var $jobs = $jobsContainer.find('div.job');
        var $noFilteredJobs = $('div#no-filtered-jobs');
        
        // Hide all displayed jobs and message
        $jobs.hide();
        $noFilteredJobs.hide();
    
        // Show relevant jobs based on selected criteria
        if (!employer.length) {
          // No filters selected, show all jobs
          $jobs.show();
        } else {
          // Filter jobs based on selected criteria
          $jobs.each(function(){
            var $job = $(this);
            var jobEmployer = $job.data('employer');
            var showJob = true;
            
            // Check employer filter
            if (employer.length > 0) {
              // Normalize filter values to match data attribute format (lowercase with hyphens)
              var normalizedEmployers = employer.map(emp => emp.replaceAll(" ", "-").toLowerCase());
              showJob = showJob && normalizedEmployers.includes(jobEmployer);
            }
            
            if (showJob) {
              $job.show();
            }
          });
      
          // Display a message if no jobs available for selected criteria
          var visible_jobs = $jobs.filter(":visible");
          if (!visible_jobs.length) {
            $noFilteredJobs.show();
          }
        }

        // Bring the jobs section top to the viewport if it isn't
        var tab_top = document.querySelector("section#jobs-section").getBoundingClientRect().top;
        if (tab_top < 0){ $("html").scrollTop(window.pageYOffset + tab_top - 60); }

      }); // Checkbox on "change" trigger ends here
    };
    
    // Call the function to fetch, parse and display jobs
    const availableJobs = await getDataFromUrl(JOBS_API_URL);
    await addJobs(availableJobs);
    enableFiltering();
     
  }); // Document "DOMContentLoaded" trigger ends here
  
</script>

{{ end }}
