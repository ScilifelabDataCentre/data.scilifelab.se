{{ define "main" }}

<section>
  <div>
    {{ .Content }}
  </div>
</section>

<!-- SciLifeLab funding related code begins here -->

<section id="fundings-calls-section">
  <!-- The fundings and calls content will be filled by JS function below -->
</section>

<!-- Code for other funding sources starts here -->
{{/* Get list of other funding sources */}}
{{ $other_funding_sources := $.Site.Data.funding_sources }}
{{ if ge (len $other_funding_sources) 1 }}
<section>
  <h4 class="mt-4">Other potential funding sources</h4>
  <div class="mt-3 mb-4">
    <div class="row g-2 mt-3 mb-4">
      {{ range $other_funding_sources }}
      <div class="col-md-6 col-lg-4">
        <div class="card-box">
          <div class="row">
            <div class="col-auto"><img src="{{ .logo }}" alt="{{ .alt }}"  height="50" width="50"></div>
            <div class="col ps-0"><h5><a target="_blank" href="{{ .url }}">{{ .funder }}</a></h5></div>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
<!-- Code for other funding sources ends here -->

<script>
  // Takes a URL and fetchs all open funding calls with label "Data Centre"
  async function getDCFundingCalls(url, label="Data Centre") {
    try {
      // Fetch DC funding directly from Anubis using API
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const allData = await response.json();
      // Check if there are 'calls' in the response and they are a list
      if (!allData?.calls || !Array.isArray(allData.calls)) {
        return [];
      }
      const allFund = allData.calls.filter((f) => f.labels.includes(label));
      return allFund.sort((a,b) => (a.closes > b.closes) ? 1 : (a.closes < b.closes) ? -1 : 0);
    } catch (error) {
      console.error('Error fetching DC fundings:', error);
      return []; // Return empty array if API fails
    }
  };

  // Code for funding sources starts here
  function getFundingsCallsHTML(dcFundings) {   
    let blockHTML = ""; 
    // If no funds to show, display appropriate message
    if(dcFundings.length !== 0) {
      blockHTML += `<div class="row g-2 mt-3 mb-4">`;
      dcFundings.forEach((item) => {
        // Skip the call if it misses either of needed info
        if (!item.closes || !item.href || !item.title) {
          return;
        }
        const close_date = new Date(item.closes);
        const close_date_formatted = close_date.toLocaleString('en-SE', { timeZone: 'Europe/Stockholm', 'month': 'short', day:'numeric', year: 'numeric', hourCycle:'h12', hour: 'numeric', minute: 'numeric' });
        blockHTML += `
        <div class="col-md-6 col-lg-4">
          <div class="card-box">
            <a href="${item.href}" target="_blank">
              <h5>${item.title}</h5>
              <div>
                <b>Deadline:</b> ${close_date_formatted + ' (Swedish time)'}
              </div>
            </a>
          </div>
        </div>`;
      }); // for each loop ends here
      blockHTML += `</div>`;
    } else {
      blockHTML += `<div class="alert alert-secondary mt-4">
                          No funding or calls are currently available from SciLifeLab Data Centre.
                      </div>`
    }
    return blockHTML;
  };

  // Functions need to be run when the DOM is ready
  document.addEventListener("DOMContentLoaded", async () => {
    let fundingHTML = "";
    try {
      const dcCalls = await getDCFundingCalls("https://anubis.scilifelab.se/api/calls/open");
      fundingHTML += getFundingsCallsHTML(dcCalls);
    } catch (error) {
      console.error("Problem adding DC funding calls", error);
      fundingHTML += `
        <div class="alert alert-danger mt-4">
          There was a problem whilst loading the funding and calls. Please try again later. If the problem persists,
          please contact us.
        </div>
      `;
    }
    const fundingSection = document.getElementById('fundings-calls-section');
    fundingSection.innerHTML = fundingHTML;
  });

</script>

{{ end }}
