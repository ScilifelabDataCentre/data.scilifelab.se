server {
    listen       8080;
    server_name  localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        index  index.html index.htm;
    }

    error_page  404              /404.html;
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
    }

    # Health check endpoint for k8s probes and external uptime monitors to use (e.g. UptimeRobot).
    # access log off to keep frequent health checks from cluttering the logs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
