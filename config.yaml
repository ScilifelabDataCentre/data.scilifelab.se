baseURL: "https://data.scilifelab.se/"
languageCode: "en-us"
buildFuture: true
params:
  title: "SciLifeLab Data Services Portal"
  description: "Get informed about Data Services from SciLifeLab"
  images:
    - https://data.scilifelab.se/img/logos/data_services_social_media.png

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags
  author: authors

permalinks:
  tags: "/highlights/tags/:slug/"
  authors: "/highlights/authors/:slug/"

related:
  includeNewer: false
  indices:
    - name: tags
      weight: 100
  threshold: 80
  toLower: false
